name: add and delete random tuples
weight: 1
# Each worker resolves $id to a fresh, uniformly-distributed value at the start
# of every cycle (see ResolveScript). The CREATE and DELETE steps below share it,
# so each cycle writes one scattered entity group and then removes it. There is
# no loop: scale the write+delete throughput with --qps (more workers) or a
# shorter --step-interval, since every worker already generates independent,
# fresh, scattered data each cycle.
{{- $id := randomObjectID }}
steps:
- op: WriteRelationships
  updates:
  - op: TOUCH
    resource: {{ $.Prefix }}resource:r_{{ $id }}
    subject: {{ $.Prefix }}user:r_{{ $id }}
    relation: reader
  - op: TOUCH
    resource: {{ $.Prefix }}resource:r_{{ $id }}
    subject: {{ $.Prefix }}user:w_{{ $id }}
    relation: writer
- op: WriteRelationships
  updates:
    - op: DELETE
      resource: {{ $.Prefix }}resource:r_{{ $id }}
      subject: {{ $.Prefix }}user:r_{{ $id }}
      relation: reader
    - op: DELETE
      resource: {{ $.Prefix }}resource:r_{{ $id }}
      subject: {{ $.Prefix }}user:w_{{ $id }}
      relation: writer
