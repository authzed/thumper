name: load some data (scattered keys)
weight: 1
recordTtl: 10m
# randomObjectID $j returns a placeholder keyed by $j, giving each of the 100
# entity groups an independent object id. That id is:
#   - deterministic within a group, so the same id appears in every update of
#     the group and the relationship chain stays connected;
#   - uniformly distributed and independent across groups, so writes scatter
#     across CRDB ranges instead of funneling into one (which would cause a hot
#     range -> WriteTooOldError, SQLSTATE 40001);
#   - regenerated for every cycle at runtime, so writes stay fresh (real inserts,
#     not no-op re-TOUCHes) without re-parsing the script.
steps:
{{- range $j := enumerate 100 }}
{{- $id := randomObjectID $j }}
- op: WriteRelationships
  updates:
  - op: TOUCH
    resource: {{ $.Prefix }}organization:org_{{ $id }}
    subject: {{ $.Prefix }}platform:plat_{{ $id }}
    relation: platform
  - op: TOUCH
    resource: {{ $.Prefix }}tenant:ps_{{ $id }}
    subject: {{ $.Prefix }}organization:org_{{ $id }}
    relation: organization
  - op: TOUCH
    resource: {{ $.Prefix }}tenant:ps_{{ $id }}
    subject: {{ $.Prefix }}client:client_{{ $id }}#token
    relation: writer
{{- range $i := enumerate 10 }}
  - op: TOUCH
    resource: {{ $.Prefix }}client:client_{{ $id }}
    subject: {{ $.Prefix }}token:t_{{ $id }}_{{ $i }}
    relation: token
{{- end }}
{{- end }}
